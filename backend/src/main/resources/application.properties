spring.application.name=backend
smartcar.ble.nombre=SmartCar
smartcar.ble.servicio=4fafc201-1fb5-459e-8fcc-c5c9c331914b
smartcar.ble.rx=beb5483e-36e1-4688-b7f5-ea07361b26a8
smartcar.ble.tx=6e400003-b5a3-f393-cfa9-e50e24dcca9e
smartcar.ble.escaneo-ms=5000

# --- Supabase (los valores reales van en variables de entorno o en backend/.env, que NO se versiona) ---
# backend/.env se carga solo si existe; funciona arrancando desde backend/ o desde la raiz del repo.
# Las variables de entorno del sistema tienen prioridad sobre .env
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
smartcar.supabase.url=${SUPABASE_URL:}
smartcar.supabase.anon-key=${SUPABASE_ANON_KEY:}
smartcar.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
# Parada segura: si la app no manda ninguna peticion durante este tiempo, el supervisor detiene el carro
smartcar.sesion.silencio-ms=${SMARTCAR_SILENCIO_MS:3000}
smartcar.cors.origenes=${SMARTCAR_CORS_ORIGINS:*}
