server.port=8080
# Escucha en todas las interfaces para que el celular (misma WiFi) pueda llegar al PC
server.address=0.0.0.0
spring.task.scheduling.pool.size=3

# ---- Enlace con la ESP32 ----
# ble      = Bluetooth real (SimpleJavaBLE)
# simulado = ESP32 falsa para probar la app sin hardware
smartcar.transporte=ble
smartcar.ble.nombre=SmartCar
smartcar.ble.servicio=4fafc201-1fb5-459e-8fcc-c5c9c331914b
smartcar.ble.rx=beb5483e-36e1-4688-b7f5-ea07361b26a8
smartcar.ble.tx=6e400003-b5a3-f393-cfa9-e50e24dcca9e
smartcar.ble.escaneo-ms=5000

# R12: por debajo de este % de bateria no se permite mover el carro. 0 = desactivar (pruebas por USB)
smartcar.bateria.nivel-minimo=20
